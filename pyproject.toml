[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexgym"
version = "2.0.0"
description = "Isaac Lab Newton tasks and a reusable SuperMimic model-based RL framework"
requires-python = "==3.12.*"
dependencies = ["isaaclab[rsl-rl]==3.0.0"]

[project.optional-dependencies]
motion = ["numpy>=2.5,<3", "scipy>=1.18,<2", "matplotlib>=3.11,<4"]

[project.entry-points."isaaclab.tasks"]
dexgym = "dexgym.tasks"

[tool.setuptools]
package-dir = {"" = "source"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["source"]
include = ["dexgym*"]
exclude = ["dexgym.assets.marvin_wuji.source_model*"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
isaaclab = { index = "nvidia" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.package-data]
"dexgym.assets" = ["manifest.json"]
"dexgym.assets.marvin_wuji" = ["calibration_status.json", "source_keyframes.json", "usd/*.usda", "usd/payloads/*.usda", "usd/payloads/*.usd", "usd/payloads/Physics/*.usda", "source_model/dual_arm_marvin.xml", "source_model/LICENSE.*", "source_model/NOTICE.md", "source_model/assets/left/*.STL", "source_model/assets/right/*.STL", "source_model/assets/wujihand2/left/*.STL", "source_model/assets/wujihand2/right/*.STL"]
"dexgym.assets.wuji_hand21" = ["README.md", "official/LICENSE", "official/mjcf/right.xml", "official/meshes/right/*.STL", "official/meshes/right/visual_nails/*.STL", "official/usd/right/*.usd", "official/usd/right/configuration/*.usd", "official/usd/right/textures/*.png", "official/usd/right/config.yaml", "official/usd/right/.asset_hash"]

"dexgym.assets.wuji_hand2_cube" = ["LICENSE", "NOTICE", "*.STL", "*.usda", "official/LICENSE", "official/**/*.xml", "official/**/*.STL", "cube/**/*.xml", "cube/**/*.png", "cube/**/*.obj", "generated/**/*.json", "generated/**/*.yaml", "generated/*.xml", "generated/**/*.STL", "generated/**/*.usda", "generated/**/*.usd", "generated/**/*.usdc", "generated/**/*.png"]
"dexgym.tasks.direct.hand2_cube_supermimic" = ["LICENSE", "NOTICE"]
"dexgym.algorithms.supermimic.dex_reference" = ["LICENSE-SuperMimic", "NOTICE"]
