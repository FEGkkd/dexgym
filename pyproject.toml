[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexgym"
version = "0.1.0"
description = "Isaac Lab reinforcement-learning tasks for dexterous hands"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "source"}

[tool.setuptools.packages.find]
where = ["source"]
include = ["dexteroushands_lab*"]
